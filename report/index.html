<title>评价调研报告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* 布局：顶部工具条 + 单栏报告；报告按 Excel 模板的六个章节排成宽表，窄屏时表格横向滚动 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #edf1f6;
  --ink: #18212b;
  --muted: #5a6776;
  --line: #d8dee6;
  --navy: #1f4e78;
  --navy-ink: #ffffff;
  --blue: #4472c4;
  --head: #d9e2f3;
  --note: #d9eaf7;
  --final: #e2f0d9;
  --ok: #2e7d4f;
  --ok-weak: #e3f2e8;
  --warn: #9a5b00;
  --warn-weak: #fbf0dc;
  --err: #b42f2f;
  --err-weak: #fbe5e5;
  --bar: #4472c4;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #171e26; --surface-2: #1e2731; --ink: #e5eaef; --muted: #9aa7b4; --line: #2a3541;
    --navy: #2a5f8f; --navy-ink: #ffffff; --blue: #5b8bdc; --head: #22324a; --note: #1a2c3d; --final: #1d3020;
    --ok: #6cc893; --ok-weak: #17301f; --warn: #e6b45c; --warn-weak: #33281a; --err: #ff8585; --err-weak: #3a1d1d; --bar: #6f9be6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #171e26; --surface-2: #1e2731; --ink: #e5eaef; --muted: #9aa7b4; --line: #2a3541;
  --navy: #2a5f8f; --navy-ink: #ffffff; --blue: #5b8bdc; --head: #22324a; --note: #1a2c3d; --final: #1d3020;
  --ok: #6cc893; --ok-weak: #17301f; --warn: #e6b45c; --warn-weak: #33281a; --err: #ff8585; --err-weak: #3a1d1d; --bar: #6f9be6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 14px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
a { color: var(--blue); }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.top h1 { margin: 0; font: 700 19px/1.2 var(--f-display); letter-spacing: .02em; }
.top .sub { color: var(--muted); font-size: 12px; }
.top .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.4; white-space: nowrap; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--err); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
@media (min-width: 980px) { .grid.two { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: start; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 4px; font: 600 16px/1.3 var(--f-display); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f > span { font-weight: 500; }
input[type=text], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; color: var(--ink); }
textarea { resize: vertical; line-height: 1.55; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cols4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .cols2, .cols4 { grid-template-columns: 1fr 1fr; } }

.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; background: var(--surface-2); }
.drop.over { border-color: var(--blue); color: var(--ink); }
.drop b { display: block; color: var(--ink); margin-bottom: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--head); font-weight: 600; }

.loaded { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.kpi b { display: block; font: 600 18px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.preview { max-height: 180px; overflow: auto; font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; margin: 0; white-space: pre-wrap; color: var(--muted); }

.steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
.steps .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; }
.steps li.doing .dot { border-color: var(--blue); }
.steps li.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.fail .dot { background: var(--err); border-color: var(--err); color: #fff; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--bar); }
@media (prefers-reduced-motion: no-preference) { .steps li.doing .dot { animation: pulse 1.2s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 25%, transparent); } }

.banner { padding: 9px 12px; border-radius: 6px; font-size: 13px; background: var(--warn-weak); color: var(--warn); }
.banner.err { background: var(--err-weak); color: var(--err); }
.banner.ok { background: var(--ok-weak); color: var(--ok); }

.hist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.hist .it { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.hist .it:first-child { border-top: 0; }
.hist .it:hover { background: var(--surface-2); }
.hist .it b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .it span { color: var(--muted); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); font-weight: 500; vertical-align: 1px; }
.tag.ex { background: var(--warn-weak); color: var(--warn); }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 24px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); margin-bottom: 4px; }

/* ---------- 报告（仿 Excel 模板） ---------- */
.rep { margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
.rep-title { background: var(--navy); color: var(--navy-ink); border-radius: 8px 8px 0 0; padding: 12px 16px; font: 700 18px/1.35 var(--f-display); text-align: center; text-wrap: balance; }
.rep-note { background: var(--note); padding: 9px 16px; font-size: 13px; border-radius: 0 0 8px 8px; margin-top: -18px; }
.sec h3 { margin: 0; background: var(--blue); color: #fff; font: 600 15px/1.4 var(--f-body); padding: 7px 12px; border-radius: 6px 6px 0 0; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; table-layout: fixed; }
table.t th { background: var(--head); font-weight: 600; padding: 8px; text-align: center; border: 1px solid var(--line); border-top: 0; font-size: 12.5px; }
table.t td { padding: 8px; border: 1px solid var(--line); vertical-align: top; line-height: 1.55; word-break: break-word; }
table.t td.n { text-align: center; font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
table.t td.n .mini { display: block; height: 4px; margin: 6px auto 0; max-width: 64px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
table.t td.n .mini i { display: block; height: 100%; background: var(--bar); }
table.t td.name { font-weight: 600; }
table.t tr.final td { background: var(--final); font-weight: 600; }
table.t td .q { color: var(--muted); }
.lvl { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.lvl.hi { background: var(--err-weak); color: var(--err); }
.lvl.mid { background: var(--warn-weak); color: var(--warn); }
.lvl.lo { background: var(--surface-2); color: var(--muted); }
.more { margin-top: 6px; }
.more summary { cursor: pointer; color: var(--blue); font-size: 12px; }
.more ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--err); }

</style>
<div id="app" class="wrap"></div>
<script>
/* 极简 Excel (.xlsx) 读写，无需第三方库。
 * 写：XlsxLite.build([{ name, rows, widths, merges, heights, styled, freeze }]) → Uint8Array
 *   rows 里的单元格可以是值，或 { v: 值, s: 样式名 }；样式名见 STYLES
 *   styled=false（默认）时：第一行表头加粗、其余自动换行、冻结首行
 * 读：await XlsxLite.read(ArrayBuffer) → [{ name, rows: [[...]] }]
 */
(function (root) {
  'use strict';
  const enc = new TextEncoder();
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  function zip(files) { // 不压缩的 zip
    const parts = []; const central = []; let offset = 0;
    files.forEach(f => {
      const name = enc.encode(f.name); const data = f.data; const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(end.buffer)];
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0)); let pos = 0;
    all.forEach(p => { out.set(p, pos); pos += p.length; });
    return out;
  }

  // ---------- 样式 ----------
  // [字体, 填充, 边框, 对齐]
  const FONT = '<name val="Microsoft YaHei"/><family val="2"/><charset val="134"/>';
  const FONTS = [
    `<font><sz val="11"/>${FONT}</font>`,                                   // 0 普通 11
    `<font><b/><sz val="11"/>${FONT}</font>`,                               // 1 粗 11
    `<font><b/><sz val="16"/><color rgb="FFFFFFFF"/>${FONT}</font>`,        // 2 标题
    `<font><sz val="10"/><color rgb="FF1F1F1F"/>${FONT}</font>`,            // 3 说明
    `<font><b/><sz val="12"/><color rgb="FFFFFFFF"/>${FONT}</font>`,        // 4 章节
    `<font><b/><sz val="10"/><color rgb="FF1F1F1F"/>${FONT}</font>`,        // 5 表头/结论
    `<font><sz val="10"/>${FONT}</font>`                                    // 6 正文 10
  ];
  const fill = rgb => `<fill><patternFill patternType="solid"><fgColor rgb="${rgb}"/><bgColor indexed="64"/></patternFill></fill>`;
  const FILLS = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>',
    fill('FFE2EDF5'), fill('FF1F4E78'), fill('FFD9EAF7'), fill('FF4472C4'), fill('FFD9E2F3'), fill('FFE2F0D9'), fill('FFFCE4D6')];
  const THIN = '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>';
  const BORDERS = ['<border><left/><right/><top/><bottom/><diagonal/></border>', THIN];
  const STYLES = { // name: [font, fill, border, h, v]
    plain: [0, 0, 0, null, null],
    legacyHead: [1, 2, 0, null, null],
    legacyCell: [0, 0, 0, null, 'top'],
    title: [2, 3, 0, 'center', 'center'],
    note: [3, 4, 0, 'left', 'center'],
    section: [4, 5, 0, 'left', 'center'],
    head: [5, 6, 1, 'center', 'center'],
    cell: [6, 0, 1, null, 'top'],
    num: [6, 0, 1, 'center', 'top'],
    final: [5, 7, 1, null, 'top'],
    warn: [6, 8, 1, null, 'top']
  };
  const STYLE_IDX = {}; Object.keys(STYLES).forEach((k, i) => { STYLE_IDX[k] = i; });
  function stylesXml() {
    const xfs = Object.values(STYLES).map(([f, fi, b, h, v]) => {
      const al = (h || v) ? `<alignment${h ? ` horizontal="${h}"` : ''}${v ? ` vertical="${v}"` : ''} wrapText="1"/>` : '';
      return `<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1"${al ? ' applyAlignment="1">' + al + '</xf>' : '/>'}`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="${FONTS.length}">${FONTS.join('')}</fonts><fills count="${FILLS.length}">${FILLS.join('')}</fills><borders count="${BORDERS.length}">${BORDERS.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  }

  const esc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function col(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function sheetXml(sh) {
    const rows = sh.rows || [];
    const widths = sh.widths || [];
    const styled = !!sh.styled;
    const freeze = sh.freeze !== undefined ? sh.freeze : !styled;
    const cols = widths.length ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const body = rows.map((r, ri) => {
      const ht = sh.heights && sh.heights[ri] ? ` ht="${sh.heights[ri]}" customHeight="1"` : '';
      return `<row r="${ri + 1}"${ht}>${(r || []).map((cell, ci) => {
        const ref = col(ci) + (ri + 1);
        let v = cell, sName = null;
        if (cell && typeof cell === 'object' && !Array.isArray(cell)) { v = cell.v; sName = cell.s || null; }
        if (!sName) sName = styled ? 'cell' : (ri === 0 ? 'legacyHead' : 'legacyCell');
        const s = ` s="${STYLE_IDX[sName] !== undefined ? STYLE_IDX[sName] : 0}"`;
        if (v === null || v === undefined || v === '') return `<c r="${ref}"${s}/>`;
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
        return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${esc(String(v).slice(0, 32000))}</t></is></c>`;
      }).join('')}</row>`;
    }).join('');
    const merges = (sh.merges || []).length ? `<mergeCells count="${sh.merges.length}">${sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${freeze && rows.length > 1 ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : ''}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/>${cols}<sheetData>${body}</sheetData>${merges}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" paperSize="9" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  }
  function build(sheets) {
    const names = []; sheets.forEach((s, i) => { let n = String(s.name || 'Sheet' + (i + 1)).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31); while (names.includes(n)) n = n.slice(0, 28) + '_' + i; names.push(n); });
    const files = [
      ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${names.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${esc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],

    return `<div class="hist">${S.reports.map(r => `<button class="it" data-a="open" data-id="${h(r.id)}"><b>${h(r.brand)} ${r.example ? '<span class="tag ex">示例</span>' : ''}</b><span>${r.sample ? r.sample.relevant + ' 条' : ''}</span>
      <span>${h(r.source || '')}</span><span>${r.createdAt ? new Date(r.createdAt).toLocaleDateString('zh-CN') : ''}</span></button>`).join('')}</div>`;
  }

  function viewReport(r) {
    const T = r.table;
    const sec = (key, title, rows, opts) => {
      opts = opts || {};
      const max = Math.max(1, ...rows.map(x => typeof x.c[1] === 'number' ? x.c[1] : 0));
      return `<section class="sec"><h3>${h(title)}</h3><div class="tw"><table class="t">
        <colgroup><col style="width:13%"><col style="width:${key === 's5' ? 6 : 8}%"><col style="width:20%"><col style="width:24%"><col style="width:17%"><col style="width:18%"></colgroup>
        <thead><tr>${HEADS[key].map(x => `<th scope="col">${h(x)}</th>`).join('')}</tr></thead><tbody>
        ${rows.length ? rows.map(x => `<tr>${x.c.map((v, i) => {
          if (i === 1 && typeof v === 'number' && key !== 's5') return `<td class="n">${v}<span class="mini"><i style="width:${Math.round(v / max * 100)}%"></i></span></td>`;
          if (key === 's5' && i === 0) return `<td class="n">${h(v)}</td>`;
          if (key === 's4' && i === 5) return `<td><span class="lvl ${/严重/.test(v) ? 'hi' : /中/.test(v) ? 'mid' : 'lo'}">${h(v)}</span></td>`;
          const evCol = { s1: 3, s2: 3, s6: 3, s3: 2, s4: 2 }[key];
          const more = i === evCol && x.q && x.q.length > 1 ? `<details class="more"><summary>更多原话（${x.q.length}）</summary><ul>${x.q.map(q => `<li>${h(q)}</li>`).join('')}</ul></details>` : '';
          return `<td class="${i === 0 ? 'name' : ''}">${br(v)}${more}</td>`;
        }).join('')}</tr>`).join('') : `<tr><td colspan="6" class="hint" style="text-align:center">没有足够的评价支撑这一部分</td></tr>`}
        ${opts.final ? `<tr class="final"><td>客流特征最终结论</td><td></td>${opts.final.map(v => `<td>${br(v)}</td>`).join('')}</tr>` : ''}
        </tbody></table></div></section>`;
    };
    return `<div class="rep">
      <div class="rep-title">${h(T.title)}</div>
      <div class="rep-note">${h(T.note)}</div>
      ${sec('s1', TITLES.s1, T.s1)}
      ${sec('s2', TITLES.s2, T.s2)}
      ${sec('s3', TITLES.s3, T.s3)}
      ${sec('s4', TITLES.s4, T.s4)}
      ${sec('s5', TITLES.s5(r.brand), T.s5)}
      ${sec('s6', TITLES.s6(T.sampleN), T.s6, { final: T.final && T.final.some(Boolean) ? T.final : null })}
      <p class="hint">命中数由 Claude 逐条阅读评价后统计，结论只引用评价里出现过的内容。${r.example ? '这份是根据你们上传的模板录入的示例，没有逐条明细。' : '导出的 Excel 里附有每条评价的打标明细，方便抽查。'}</p>
    </div>`;
  }

  // ---------- 读入数据 ----------
  async function loadFile(file) {
    S.msg = null;
    try {
      const name = file.name.toLowerCase(); const buf = await file.arrayBuffer();
      if (name.endsWith('.json')) return useText(P.decodeText(buf));
      if (name.endsWith('.xlsx')) {
        const sheets = await X.read(buf);
        const sh = sheets.slice().sort((a, b) => b.rows.length - a.rows.length)[0];
        if (!sh || sh.rows.length < 2) throw new Error('表格里没有数据');
        return useTable(sh.rows, `${file.name}`);
      }
      const text = P.decodeText(buf);
      if (name.endsWith('.csv')) return useTable(P.parseCSV(text), file.name);
      return useText(text, file.name);
    } catch (e) { S.msg = { k: 'err', t: '读取失败：' + (e.message || '文件格式不对') + '。支持 .xlsx（不支持老的 .xls，可另存为 .xlsx）、.csv、.json、.txt' }; render(); }
  }
  function useTable(rows, label) {
    const map = P.guessColumns(rows);
    if (map.text < 0) throw new Error('没找到评价内容列');
    S.src = { kind: 'table', label: `${label}`, table: { rows, map }, items: P.prepare(P.fromTable(rows, map)).items };
    if (!S.form.brand) S.form.brand = label.replace(/\.(xlsx|csv)$/i, '').replace(/[-_ ]?(评价|评论|导出|数据).*$/, '');
    render();
  }
  function useText(text, label) {
    text = String(text || '').trim();
    if (!text) { S.msg = { k: 'err', t: '没有内容' }; render(); return; }
    let data = null;
    if (/^[{[]/.test(text)) { try { data = JSON.parse(text); } catch (e) { data = null; } }
    if (data && (data.comments || data.posts)) {
      const r = P.fromExtension(data);
      S.src = { kind: 'ext', label: r.label, items: P.prepare(r.items).items };
      if (!S.form.brand) S.form.brand = r.brand;
    } else {
      S.src = { kind: 'text', label: label || '粘贴的评价', items: P.prepare(P.fromPlain(text)).items };
    }
    if (!S.src.items.length) { S.msg = { k: 'err', t: '没读到有效评价（每条至少 4 个字）' }; S.src = null; }
    render();
  }

  // ---------- 分析任务 ----------
  async function startJob() {
    const brand = S.form.brand.trim(); if (!brand) { toast('先填门店/品牌名'); document.getElementById('f-brand')?.focus(); return; }
    saveForm();
    const raw = S.src.kind === 'table' ? P.fromTable(S.src.table.rows, S.src.table.map) : S.src.items;
    const prep = P.prepare(raw.map(x => Object.assign({}, x)), +S.form.cap || 800);
    S.job = { id: uid('rep'), brand, menu: S.form.menu.trim(), items: prep.items, total: prep.total, source: S.src.label, tax: null, tags: {}, batches: [], stage: 'tax', done: {}, running: false, paused: false, note: '', failed: null, ctl: null };
    render(); run();
  }
  function errNote(e) {
    const c = e && e.code;
    if (c === 'not_granted') return ['你没有允许这个页面使用 Claude，分析已停止。刷新页面后可以重新允许。', 'stop'];
    if (c === 'rate_limited' || c === 'queue_overflow') return ['Claude 用量暂时到上限了。等几分钟后点"继续"，已完成的部分不会丢。', 'pause'];
    if (c === 'sampling_disabled' || c === 'capability_disabled' || c === 'capability_removed') return ['当前账号不能在页面里使用 Claude。', 'stop'];
    if (c === 'session_expired') return ['登录已过期，请刷新页面后点"继续"。', 'pause'];
    if (c === 'prompt_too_large') return ['一次发送的内容太多，请把分析条数调小。', 'stop'];
    if (c === 'cancelled') return ['已停止。', 'pause'];
    return [`这一步没成功（${c || '网络问题'}）。可以点"重试"。`, 'fail'];
  }
  async function run() {
    const j = S.job; if (!j || j.running) return;
    j.running = true; j.paused = false; j.note = ''; j.failed = null; render();
    try {
      // 1. 分类
      if (!j.tax) {
        j.stage = 'tax'; render();
        j.ctl = new AbortController();
        const raw = await S.sample.json(P.taxonomyPrompt(j.brand, j.menu, j.items), { modelTier: 'complex', signal: j.ctl.signal });
        const tax = P.validTax(raw); if (!tax || !tax.products.length) throw { code: 'invalid_json' };
        j.tax = tax; j.done.tax = true;
        for (let i = 0; i < j.items.length; i += 80) j.batches.push({ items: j.items.slice(i, i + 80), status: 'wait' });
      }
      // 2. 打标（同时跑 2 批）
      if (!j.done.tag) {
        j.stage = 'tag'; render();
        let stopReason = null;
        const worker = async () => {
          while (!stopReason) {
            const b = j.batches.find(x => x.status === 'wait'); if (!b) return;
            b.status = 'run';
            const ctl = new AbortController(); b.ctl = ctl; j.ctls = (j.ctls || []).concat(ctl);
            try {
              const out = await S.sample.json(P.tagPrompt(j.brand, j.tax, b.items), { modelTier: 'default', signal: ctl.signal });
              const tags = P.validTags(out, b.items);
              if (Object.keys(tags).length < b.items.length * 0.6) throw { code: 'invalid_json' };
              Object.assign(j.tags, tags); b.status = 'ok';
            } catch (e) {
              const [note, kind] = errNote(e);
              if (kind === 'fail') { b.status = 'fail'; b.err = e && e.code; }
              else { b.status = 'wait'; stopReason = stopReason || { note, kind }; }
            }
            render();
          }
        };
        await Promise.all([worker(), worker()]);
        if (stopReason) { j.note = stopReason.note; j.noteKind = stopReason.kind === 'stop' ? 'err' : ''; j.paused = stopReason.kind === 'pause'; j.running = false; render(); return; }
        const fails = j.batches.filter(b => b.status === 'fail');
        if (fails.length && !j.skipFail) {
          j.note = `${fails.length} 批（${fails.reduce((s, b) => s + b.items.length, 0)} 条）没有成功。可以重试，或者跳过直接出报告。`;
          j.running = false; render(); return;
        }
        j.done.tag = true;
      }
      // 3. 统计 + 写结论
      j.stage = 'write'; render();
      const A = P.aggregate(j.items, j.tags, j.tax);
      const meta = { relevant: A.totals.relevant, analyzed: A.totals.tagged, total: j.total, range: P.dateRange(j.items), source: j.source };
      j.ctl = new AbortController();
      const W = await S.sample.json(P.writePrompt(j.brand, A, meta), { modelTier: 'complex', signal: j.ctl.signal });
      j.done.write = true;
      await saveReport(j, A, W, meta);
    } catch (e) {
      const [note, kind] = errNote(e);
      j.note = note; j.noteKind = kind === 'stop' ? 'err' : '';
      if (kind === 'fail') j.failed = j.stage; else j.paused = kind === 'pause';
      j.running = false; render(); return;
    }
    j.running = false;
  }

  // ---------- 保存（团队共享） ----------
  function itemRows(j, tax) {
    const name = {}; tax.products.forEach(p => { name[p.id] = p.name; }); tax.praise.forEach(p => { name[p.id] = p.name; }); tax.complaints.forEach(p => { name[p.id] = p.name; }); P.SEGMENTS.forEach(s => { name[s.id] = s.name; });
    const nm = id => name[id] || String(id).replace(/^新[:：]/, '');
    return j.items.map(it => {
      const t = j.tags[it.i];
      return { i: it.i, t: it.t, l: it.l || 0, d: it.d || '', src: it.src || '', rel: t ? (t.r === 0 ? '无关' : '有效') : '未分析',
        p: t ? (t.p || []).filter(Array.isArray).map(([id, dir, det]) => `${nm(id)}(${dir === '+' ? '好' : dir === '-' ? '差' : '提及'}${det ? '：' + det : ''})`).join('；') : '',
        g: t ? (t.g || []).map(nm).join('、') : '', b: t ? (t.b || []).map(nm).join('、') : '', s: t ? (t.s || []).map(nm).join('、') : '' };
    });
  }
  async function saveReport(j, A, W, meta) {
    const table = buildTable(j.brand, A, W, meta);
    const doc = { id: j.id, brand: j.brand, createdAt: new Date().toISOString(), source: j.source,
      sample: { relevant: meta.relevant, analyzed: meta.analyzed, total: meta.total, from: meta.range ? meta.range.from : '', to: meta.range ? meta.range.to : '' },
      table, tax: { products: j.tax.products.map(p => p.name), praise: j.tax.praise.map(p => p.name), complaints: j.tax.complaints.map(p => p.name) }, chunks: 0 };
    const rows = itemRows(j, j.tax);
    S.items = { id: j.id, rows };
    try {
      if (S.user) { try { doc.by = await S.user.id(); } catch (e) { /* 匿名 */ } }
      const chunks = []; for (let i = 0; i < rows.length; i += 120) chunks.push(rows.slice(i, i + 120));
      doc.chunks = chunks.length;
      if (S.db) {
        await S.db.collection('reports').doc(j.id).set(doc);
        for (let k = 0; k < chunks.length; k++) await S.db.collection('reportItems').doc(`${j.id}_${k}`).set({ reportId: j.id, k, rows: chunks[k] });
      }
    } catch (e) {
      S.msg = { k: 'err', t: e && e.code === 'quota_exceeded' ? '团队库存满了，报告只在本次打开期间可见。请先导出 Excel 保存。' : '报告没能保存到团队（' + ((e && e.code) || '网络问题') + '），请先导出 Excel 保存。' };
    }
    if (!S.reports.find(r => r.id === doc.id)) S.reports.unshift(doc);
    S.job = null; S.src = null; S.view = 'report'; S.openId = doc.id; render(); window.scrollTo(0, 0);
    toast('报告已生成');
  }
  async function loadItems(rep) {
    if (S.items && S.items.id === rep.id) return S.items.rows;
    if (!S.db || !rep.chunks) return [];
    const rows = [];
    for (let k = 0; k < rep.chunks; k++) { const d = await S.db.collection('reportItems').doc(`${rep.id}_${k}`).get(); if (d.exists) rows.push(...(d.data().rows || [])); }
    S.items = { id: rep.id, rows }; return rows;
  }

  // ---------- Excel ----------
  async function exportXlsx(rep) {
    const T = rep.table;
    const rows = [], merges = [], heights = {};
    const add = (cells, ht) => { rows.push(cells); if (ht) heights[rows.length - 1] = ht; return rows.length; };
    const full = (v, s, ht) => { const r = add([{ v, s }, { v: '', s }, { v: '', s }, { v: '', s }, { v: '', s }, { v: '', s }], ht); merges.push(`A${r}:F${r}`); };
    full(T.title, 'title', 30);
    full(T.note, 'note', 40);
    const section = (key, title, list, final) => {
      add([]);
      full(title, 'section', 24);
      add(HEADS[key].map(v => ({ v, s: 'head' })), 32);
      list.forEach(x => add(x.c.map((v, i) => ({ v, s: (i === 1 && typeof v === 'number') || (key === 's5' && i === 0) ? 'num' : (key === 's4' && i === 5 && /严重/.test(v) ? 'warn' : 'cell') })), 72));
      if (final) add([{ v: '客流特征最终结论', s: 'final' }, { v: '', s: 'final' }, ...final.map(v => ({ v, s: 'final' }))], 90);
    };
    section('s1', TITLES.s1, T.s1); section('s2', TITLES.s2, T.s2); section('s3', TITLES.s3, T.s3); section('s4', TITLES.s4, T.s4);
    section('s5', TITLES.s5(rep.brand), T.s5); section('s6', TITLES.s6(T.sampleN), T.s6, T.final && T.final.some(Boolean) ? T.final : null);
    const sheets = [{ name: `${rep.brand}-评价调研`.slice(0, 31), styled: true, widths: [22, 14, 36, 48, 32, 36], rows, merges, heights }];
    if (!rep.example) {
      const items = await loadItems(rep).catch(() => []);
      if (items.length) sheets.push({ name: '评价明细（打标）', widths: [6, 60, 8, 12, 8, 8, 40, 28, 28, 28], rows: [['序号', '评价', '点赞', '日期', '来源', '是否有效', '提到的产品', '好评点', '吐槽点', '客流/场景'], ...items.map(r => [r.i, r.t, r.l, r.d, r.src, r.rel, r.p, r.g, r.b, r.s])] });
    }
    const bytes = X.build(sheets);
    const name = `${rep.brand}-顾客评价调研.xlsx`;
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (S.downloads) {
      try { await S.downloads.save({ filename: name, data: blob }); return; }
      catch (e) { if (e && e.code === 'declined') return; if (e && e.code !== 'unavailable' && e.code !== 'not_granted') { toast('导出失败：' + (e.code || '')); return; } }
    }
    toast('这里不能下载文件，请在 Claude 里打开这个页面再导出');
  }

  // ---------- 事件 ----------
  app.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    switch (a) {
      case 'mode': S.form.mode = el.dataset.v; render(); break;
      case 'readpaste': useText(document.getElementById('paste').value); break;
      case 'run': startJob(); break;
      case 'stop': if (S.job) { (S.job.ctls || []).forEach(c => c.abort()); if (S.job.ctl) S.job.ctl.abort(); } break;
      case 'resume': run(); break;
      case 'retry': S.job.batches.forEach(b => { if (b.status === 'fail') b.status = 'wait'; }); run(); break;
      case 'skipfail': S.job.skipFail = true; run(); break;
      case 'canceljob': if (S.job) { (S.job.ctls || []).forEach(c => c.abort()); if (S.job.ctl) S.job.ctl.abort(); } S.job = null; render(); break;
      case 'open': S.view = 'report'; S.openId = el.dataset.id; S.confirm = null; S.msg = null; render(); window.scrollTo(0, 0); break;
      case 'home': S.view = 'home'; S.openId = null; S.confirm = null; render(); break;
      case 'xlsx': { const r = S.reports.find(x => x.id === S.openId); if (r) { el.disabled = true; await exportXlsx(r); el.disabled = false; } break; }
      case 'askdel': S.confirm = 'del'; render(); break;
      case 'nodel': S.confirm = null; render(); break;
      case 'del': {
        const r = S.reports.find(x => x.id === S.openId); if (!r) return;
        try { if (S.db) { await S.db.collection('reports').doc(r.id).delete(); for (let k = 0; k < (r.chunks || 0); k++) await S.db.collection('reportItems').doc(`${r.id}_${k}`).delete(); } }
        catch (err) { toast('删除失败：' + (err.code || '没有权限')); return; }
        S.reports = S.reports.filter(x => x.id !== r.id); S.view = 'home'; S.confirm = null; toast('已删除'); render(); break;
      }
    }
  });
  app.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if (k === 'brand' || k === 'menu') S.form[k] = e.target.value; });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'file' && t.files && t.files[0]) { loadFile(t.files[0]); return; }
    if (t.dataset.f === 'cap') { S.form.cap = +t.value; render(); return; }
    if (t.dataset.map && S.src && S.src.table) {
      S.src.table.map[t.dataset.map] = +t.value;
      S.src.items = P.prepare(P.fromTable(S.src.table.rows, S.src.table.map)).items; render();
    }
  });
  app.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  app.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  app.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); } });
  window.addEventListener('beforeunload', e => { if (S.job && S.job.running) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- 启动 ----------
  render();
  (async () => {
    const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [db, sample, downloads, user] = await Promise.all([use('db'), use('sample'), use('downloads'), use('user')]);
    Object.assign(S, { db, sample, downloads, user });
    if (db) {
      db.collection('reports').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
        const local = S.reports.filter(r => !snap.docs.some(d => d.id === r.id) && !r._remote && S.job === null && r.id === S.openId);
        S.reports = snap.docs.map(d => Object.assign({ _remote: true }, d.data(), { id: d.id })).concat(local);
        S.loadedList = true;
        const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
        render();
      }, () => { S.loadedList = true; render(); });
    } else { S.loadedList = true; }
    render();
  })();
  window.__rv = S;
})();

</script>

<!-- 禧聚 运营驾驶舱 · 数据来自 /cockpit/api/ops（美团管家 + 门店经营日报） -->
<title>禧聚 运营驾驶舱</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1917; --mute: #6b6560; --faint: #a8a29e; --line: #e7e5e4;
  --accent: #b91c1c; --good: #15803d; --bad: #b91c1c; --warn: #b45309; --bar: #d6d3d1; --hl: #fef2f2;
  --f: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --m: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root { --bg: #12110f; --panel: #1c1a17; --ink: #f5f5f4; --mute: #a8a29e; --faint: #6b6560; --line: #2e2b27; --accent: #f87171; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --bar: #44403c; --hl: #2a1515; } }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f); margin: 0; padding: 0 16px 48px }
.wrap { max-width: 1180px; margin: 0 auto }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em }
h1 small { font-size: 13px; color: var(--mute); font-weight: 400; margin-left: 6px }
.grow { flex: 1 }
.datebar { display: flex; align-items: center; gap: 6px }
button, select { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer }
button:hover { border-color: var(--mute) }
a { color: var(--accent) }
.status { font-size: 12px; color: var(--mute) }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.kpi .l { font-size: 12px; color: var(--mute) }
.kpi .v { font: 600 22px/1.3 var(--m); margin: 2px 0 }
.kpi .c { font-size: 12px; color: var(--mute) }
.up { color: var(--good) } .down { color: var(--bad) }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px }
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px }
.card h2 .hint { font-size: 12px; color: var(--mute); font-weight: 400 }
.tbl { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right }
th { color: var(--mute); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel) }
th:first-child, td:first-child { text-align: left }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--hl) }
tr.sel { background: var(--hl) }
td .s { display: block; font-size: 11px; color: var(--mute) }
.num { font-family: var(--m) }
.detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
.dish { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line) }
.hrs { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding-top: 6px }
.hrs div { flex: 1; background: var(--bar); border-radius: 3px 3px 0 0; position: relative; min-width: 8px }
.hrs div.pk { background: var(--accent) }
.hrs span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--mute) }
.hrs b { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 500 }
pre.rep { white-space: pre-wrap; font: 13px/1.6 var(--f); margin: 0; max-height: 520px; overflow: auto }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink) }
svg text { fill: var(--mute); font-size: 11px }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; margin-top: 6px }
.legend label { display: flex; align-items: center; gap: 4px; cursor: pointer }
.empty { color: var(--mute); padding: 20px 0; text-align: center }
@media (max-width: 640px) { h1 { font-size: 18px } .kpi .v { font-size: 19px } }
</style>
<div class="wrap">
  <header>
    <h1>运营驾驶舱<small>禧聚 · 美团管家 + 门店日报</small></h1>
    <div class="grow"></div>
    <div class="datebar"><button id="prev" aria-label="前一天">‹</button><input id="date" type="date" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel);color:var(--ink)"><button id="next" aria-label="后一天">›</button></div>
    <a href="/cockpit/logout" class="status">退出</a>
  </header>
  <div class="status" id="st"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>各门店 <span class="hint" id="tblHint">点一行看菜品和时段开台；小字是环比（上周同一天）/ 同比（去年同星期几）</span></h2><div class="tbl"><table id="tbl"></table></div></div>
  <div class="card" id="det" hidden></div>
  <div class="card"><h2>营业额走势 <span class="hint">近 30 天，每天营业额（含外卖）</span></h2><div id="trend"></div><div class="legend" id="lg"></div></div>
  <div class="card"><h2>报告 <span class="hint">每天 8 点推送的日报，周一周报，每月 1 号月报</span></h2><div class="tabs" id="rtabs"></div><pre class="rep" id="rep"></pre></div>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('en-US');
  const wan = n => n == null || !isFinite(n) ? '—' : (Math.abs(n) >= 1e4 ? (n / 1e4).toFixed(2).replace(/\.?0+$/, '') + '万' : fmt(n));
  const ps = x => x == null || !isFinite(x) ? '—' : (x > 0 ? '+' : '') + Math.round(x * 100) + '%';
  const cl = x => x == null || !isFinite(x) ? '' : x > 0.005 ? 'up' : x < -0.005 ? 'down' : '';
  const short = s => String(s).replace(/^(深圳|广州|佛山|珠海|东莞|惠州)/, '').replace(/店$/, '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ymd = t => new Date(t + 8 * 3600e3).toISOString().slice(0, 10);
  const add = (d, n) => ymd(Date.parse(d + 'T00:00:00+08:00') + n * 864e5);
  let D = null, sel = null, cur = add(ymd(Date.now()), -1), hidden = {}; let repKey = 'daily';
  try { hidden = JSON.parse(localStorage.getItem('ops-hide') || '{}'); } catch (e) { }
  $('date').value = cur; $('date').max = add(ymd(Date.now()), -1);
  $('prev').onclick = () => go(add(cur, -1)); $('next').onclick = () => { if (cur < add(ymd(Date.now()), -1)) go(add(cur, 1)); }; $('date').onchange = e => go(e.target.value);
  function go(d) { cur = d; $('date').value = d; load(); }
  async function load() {
    $('st').textContent = '读取中…';
    try {
      const r = await fetch('/cockpit/api/ops?date=' + cur, { credentials: 'same-origin' });
      if (r.status === 401) { location.href = '/cockpit/login'; return; }
      D = await r.json(); if (!D.ok) throw new Error(D.error || '读取失败'); render();
    } catch (e) { $('st').textContent = '⚠️ ' + e.message; }
  }
  function render() {
    const day = D.day, T = day.T, g = D.gj || {};
    $('st').textContent = `${day.date}（${day.week}）· 美团管家数据 ${day.gjOk ? '已到' : '这天还没查到，先用门店日报的数'}` + (g.lastOk ? ` · 插件最近一次查数 ${new Date(g.lastOk).toLocaleString('zh-CN', { hour12: false })}` : '') + (g.lastErr ? ` · 最近问题：${g.lastErr}` : '');
    const K = [['营业额', wan(T.total), `环比 <span class="${cl(T.wow)}">${ps(T.wow)}</span> · 同比 <span class="${cl(T.yoy)}">${ps(T.yoy)}</span>`], ['堂食', wan(T.dine), ''], ['外卖', wan(T.takeout), T.total ? '占 ' + Math.round(T.takeout / T.total * 100) + '%' : ''], ['开台数', fmt(T.tables), ''], ['用餐人数', fmt(T.guests), T.tables ? '桌均 ' + (T.guests / T.tables).toFixed(1) + ' 人' : ''], ['差评', fmt(T.bad), '各平台合计']];
    $('kpis').innerHTML = K.map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="c">${k[2]}</div></div>`).join('');
    const rows = day.rows.slice().sort((a, b) => (b.total || -1) - (a.total || -1));
    const c2 = (o) => o ? `<span class="s"><span class="${cl(o.wow)}">${ps(o.wow)}</span> / <span class="${cl(o.yoy)}">${ps(o.yoy)}</span></span>` : '';
    $('tbl').innerHTML = '<thead><tr><th>门店</th><th>营业额</th><th>堂食</th><th>外卖</th><th>开台</th><th>人数</th><th>桌均</th><th>人均</th><th>翻台</th><th>晚市高峰</th><th>差评</th><th>曝光是同行</th><th>评分 点评/美团/抖音/外卖</th></tr></thead><tbody>' + rows.map(r => {
      if (r.missing) return `<tr><td>${short(r.store)}</td><td colspan="12" style="text-align:left;color:var(--mute)">这天没有数据</td></tr>`;
      const bad = (r.dpBad || 0) + (r.mtBad || 0) + (r.dyBad || 0) + (r.wmBad || 0);
      return `<tr data-s="${esc(r.store)}" class="${sel === r.store ? 'sel' : ''}"><td>${short(r.store)}${r.src === '日报' ? '<span class="s">门店日报</span>' : ''}</td><td class="num">${wan(r.total)}${c2(r.c.total)}</td><td class="num">${wan(r.dine)}${c2(r.c.dine)}</td><td class="num">${wan(r.takeout)}${c2(r.c.takeout)}</td><td class="num">${fmt(r.tables)}${c2(r.c.tables)}</td><td class="num">${fmt(r.guests)}${c2(r.c.guests)}</td><td class="num">${fmt(r.tableAvg)}${c2(r.c.tableAvg)}</td><td class="num">${fmt(r.perCap)}${c2(r.c.perCap)}</td><td class="num">${r.flip ? (+r.flip).toFixed(2) : '—'}</td><td class="num">${r.peak ? r.peak.hh + ' · ' + r.peak.tables + '台' : '—'}</td><td class="num ${bad ? 'down' : ''}">${bad}${(r.badText || []).length ? '<span class="s">原文 ' + r.badText.length + '</span>' : ''}</td><td class="num">${r.jyb && r.jyb.viewPeer ? (r.jyb.view / r.jyb.viewPeer).toFixed(1) + '倍' : '—'}</td><td class="num">${[r.dp, r.mt, r.dy, r.wm].map(x => x == null ? '—' : x).join(' / ')}</td></tr>`;
    }).join('') + '</tbody>';
    $('tbl').querySelectorAll('tbody tr[data-s]').forEach(tr => tr.onclick = () => { sel = sel === tr.dataset.s ? null : tr.dataset.s; render(); });
    detail(); trend(); reports();
  }
  function detail() {
    const el = $('det'); const r = sel && D.day.rows.find(x => x.store === sel); if (!r || r.missing) { el.hidden = true; return; } el.hidden = false;
    const hrs = (r.hours || []).filter(h => h.tables); const mx = Math.max(1, ...hrs.map(h => h.tables));
    const pk = r.peak ? r.peak.hh : '';
    el.innerHTML = `<h2>${short(r.store)} · ${D.day.date}</h2><div class="detail">
      <div><div class="status" style="margin-bottom:6px">销量前五（不含饮料）</div>${(r.top || []).map((x, i) => `<div class="dish"><span>${i + 1}. ${esc(x.name)}</span><span class="num">${fmt(x.qty)} 份 · ${wan(x.amt)}</span></div>`).join('') || '<div class="empty">管家菜品数据没查到</div>'}
        ${(r.drinks || []).length ? `<div class="status" style="margin:10px 0 4px">饮料前三</div>` + r.drinks.map(x => `<div class="dish"><span>${esc(x.name)}</span><span class="num">${fmt(x.qty)}</span></div>`).join('') : ''}</div>
      <div><div class="status" style="margin-bottom:6px">每小时开台数（结账时间）</div>${hrs.length ? `<div class="hrs">${hrs.map(h => `<div class="${h.hh === pk ? 'pk' : ''}" style="height:${Math.max(4, h.tables / mx * 90)}%"><b>${h.tables}</b><span>${h.hh.slice(0, 2)}</span></div>`).join('')}</div><div style="height:22px"></div>` : '<div class="empty">没有时段数据</div>'}
        <div class="status">用餐时长 ${r.mealMin ? r.mealMin + ' 分钟' : '—'} · 上座率 ${r.seatRate ? Math.round(r.seatRate * 100) + '%' : '—'} · 优惠 ${wan(r.discount)}</div></div>
      <div><div class="status" style="margin-bottom:6px">口碑</div>
        ${[['大众点评', r.dp, r.dpBad], ['美团', r.mt, r.mtBad], ['抖音', r.dy, r.dyBad], ['美团外卖', r.wm, r.wmBad]].map(x => `<div class="dish"><span>${x[0]}</span><span class="num">${x[1] == null ? '—' : x[1]} 分 · 差评 <b class="${x[2] ? 'down' : ''}">${x[2] || 0}</b></span></div>`).join('')}
        ${r.cust && r.cust.newBuy != null ? `<div class="status" style="margin:10px 0 4px">新客 / 老客（${esc(String(r.cust.from || '').slice(4, 6))}/${esc(String(r.cust.from || '').slice(6))} 那周，团购和买单顾客）</div><div class="dish"><span>新客 ${fmt(r.cust.newBuy)} · 老客 ${fmt(r.cust.oldBuy)}</span><span class="num">老客占 ${(r.cust.newBuy + r.cust.oldBuy) ? Math.round(r.cust.oldBuy / (r.cust.newBuy + r.cust.oldBuy) * 100) : '—'}%</span></div><div class="dish"><span>复购率</span><span class="num">${r.cust.repurchase != null ? (r.cust.repurchase * 100).toFixed(1) + '%' : '—'}${r.cust.repurchasePeer ? '（比同行 ' + esc(r.cust.repurchasePeer) + '）' : ''}</span></div>` : ''}</div></div>
      ${r.jyb ? `<div class="status" style="margin:14px 0 6px">和商圈同行比（美团经营宝「商圈同行店均」）</div><div class="tbl"><table><thead><tr><th>指标</th><th>本店</th><th>同行店均</th><th>是同行的</th></tr></thead><tbody>${[['曝光人数', r.jyb.view, r.jyb.viewPeer], ['访问人数', r.jyb.visit, r.jyb.visitPeer], ['团购购买人数', r.jyb.buy, r.jyb.buyPeer], ['新增收藏', r.jyb.collect, r.jyb.collectPeer], ['打卡人数', r.jyb.checkin, r.jyb.checkinPeer], ['新增评价', r.jyb.review, r.jyb.reviewPeer]].filter(x => x[1] != null).map(x => `<tr style="cursor:default"><td>${x[0]}</td><td class="num">${fmt(x[1])}</td><td class="num">${x[2] != null ? (+x[2]).toFixed(x[2] < 100 ? 1 : 0) : '—'}</td><td class="num ${x[2] && x[1] / x[2] < 1 ? 'down' : ''}">${x[2] ? (x[1] / x[2]).toFixed(1) + ' 倍' : '—'}</td></tr>`).join('')}${r.jyb.cvr != null ? `<tr style="cursor:default"><td>访问→购买转化率</td><td class="num">${(r.jyb.cvr * 100).toFixed(1)}%</td><td class="num">${r.jyb.cvrPeer != null ? (r.jyb.cvrPeer * 100).toFixed(1) + '%' : '—'}</td><td></td></tr>` : ''}</tbody></table></div>` : ''}
      ${(r.badText || []).length ? `<div class="status" style="margin:14px 0 6px">差评原文（点评 + 美团，${r.badText.length} 条）</div>` + r.badText.map(b => `<div class="dish" style="display:block"><b>${esc(b.p)} ${b.star != null ? esc(b.star) + '星' : ''}</b> <span class="status">${esc(b.t || '')}${b.replied === false ? ' · 未回复' : ''}</span><div>${esc(b.text)}</div></div>`).join('') : (D.day.jybOk ? '<div class="status" style="margin-top:12px">这天点评、美团没有新差评</div>' : '<div class="status" style="margin-top:12px">经营宝这天的数据还没查到</div>')}`;
  }
  const COLORS = ['#b91c1c', '#1d4ed8', '#15803d', '#b45309', '#7c3aed', '#0e7490', '#be185d', '#4d7c0f', '#9a3412', '#475569'];
  function trend() {
    const T = D.trend || []; const stores = Object.keys(T[0] || {}).filter(k => k !== 'date');
    $('lg').innerHTML = stores.map((s, i) => `<label><input type="checkbox" data-k="${esc(s)}" ${hidden[s] ? '' : 'checked'}><span style="display:inline-block;width:10px;height:3px;background:${COLORS[i % 10]}"></span>${esc(s)}</label>`).join('');
    $('lg').querySelectorAll('input').forEach(c => c.onchange = () => { hidden[c.dataset.k] = !c.checked; try { localStorage.setItem('ops-hide', JSON.stringify(hidden)); } catch (e) { } trend(); });
    const show = stores.filter(s => !hidden[s]); const W = Math.max(320, Math.min(1140, ($('trend').clientWidth || 900))), H = 240, L = 46, B = 24, R = 10, Tp = 10;
    const vals = T.flatMap(r => show.map(s => r[s]).filter(v => v != null)); if (!vals.length) { $('trend').innerHTML = '<div class="empty">还没有数据</div>'; return; }
    const mx = Math.max(...vals) * 1.08; const x = i => L + i * (W - L - R) / Math.max(1, T.length - 1); const y = v => Tp + (H - Tp - B) * (1 - v / mx);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="营业额走势">`;
    for (let k = 0; k <= 4; k++) { const v = mx * k / 4; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1e4 ? (v / 1e4).toFixed(1) + '万' : Math.round(v)}</text>`; }
    const stp = Math.ceil(T.length / 8); T.forEach((r, i) => { if (i % stp === 0 || (i === T.length - 1 && i % stp > stp / 2)) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${r.date.slice(5)}</text>`; });
    show.forEach(s => { const i0 = stores.indexOf(s); let d = ''; T.forEach((r, i) => { if (r[s] == null) return; d += (d && T[i - 1] && T[i - 1][s] != null ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[s]).toFixed(1); }); svg += `<path d="${d}" fill="none" stroke="${COLORS[i0 % 10]}" stroke-width="1.8"><title>${esc(s)}</title></path>`; });
    $('trend').innerHTML = svg + '</svg>';
  }
  function reports() {
    const L = D.last || {}; const keys = [['daily', '日报'], ['week', '周报'], ['month', '月报']].filter(k => L[k[0]]);
    if (!keys.length) { $('rtabs').innerHTML = ''; $('rep').textContent = '还没有推送过报告。每天早上 8 点推送后，这里会显示最近一份。'; return; }
    if (!L[repKey]) repKey = keys[0][0];
    $('rtabs').innerHTML = keys.map(k => `<button data-k="${k[0]}" class="${k[0] === repKey ? 'on' : ''}">${k[1]}</button>`).join('');
    $('rtabs').querySelectorAll('button').forEach(b => b.onclick = () => { repKey = b.dataset.k; reports(); });
    $('rep').textContent = (L[repKey].text || '') + (L[repKey].at ? '\n\n（推送时间 ' + new Date(L[repKey].at).toLocaleString('zh-CN', { hour12: false }) + '）' : '');
  }
  window.addEventListener('resize', () => D && trend());
  load();
})();
</script>

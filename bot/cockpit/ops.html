<!-- 禧聚 运营驾驶舱 v2 · 和老板驾驶舱同一套深色指挥台风格 · 数据来自 /cockpit/api/ops（美团管家 + 经营宝 + 门店日报） -->
<title>禧聚 运营驾驶舱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #e6edf7; --mute: #8b9bb4; --faint: #56657d;
  --deep: #070d18; --panel: #0d1626; --panel2: #111d31; --line: #1e2c45;
  --cyan: #4cc9f0; --amber: #ffb547; --good: #3ddc97; --bad: #ff6b6b; --rose: #ff6b9a;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: radial-gradient(1200px 600px at 50% -10%, #12234080, transparent 70%), var(--deep); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); margin: 0 }
.wrap { max-width: 1180px; margin: 0 auto }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0; background: linear-gradient(var(--deep) 75%, transparent) }
.brand { font-weight: 900; letter-spacing: .08em; font-size: 13px } .brand b { color: var(--amber) }
.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tab { font: inherit; color: var(--mute); background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; text-decoration: none; font-size: 14px }
.tab:hover { color: var(--ink) }
.status { margin-left: auto; display: flex; gap: 12px; color: var(--mute); font-size: 12px; align-items: center; flex-wrap: wrap }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; background: var(--faint) } .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good) } .dot.off { background: var(--amber) }
.datebar { display: flex; align-items: center; gap: 4px }
.datebar button, .datebar input { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; color-scheme: dark }
.status a { color: var(--mute); text-decoration: none } .status a:hover { color: var(--ink) }
.say { background: var(--panel); border: 1px solid #ffb54755; box-shadow: 0 0 0 1px #ffb54718, 0 8px 40px -14px #ffb54744; border-radius: 10px; padding: 12px 16px; margin: 6px 0 16px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap }
.say h1 { font-size: 15px; margin: 0; white-space: nowrap } .say p { margin: 0; color: var(--ink); font-size: 13px; flex: 1; min-width: 240px }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0 }
.kpi small { color: var(--faint); font-size: 11px; display: block }
.kpi b { font-family: var(--f-data); font-size: 21px; font-weight: 600; display: block; line-height: 1.35; white-space: nowrap }
.kpi .c { font-size: 11px; color: var(--mute); font-family: var(--f-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi svg { display: block; width: 100%; height: 26px; margin-top: 4px }
.up { color: var(--good) } .down { color: var(--bad) }
.sec { font-size: 11px; color: var(--faint); letter-spacing: .12em; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline }
.sec span { letter-spacing: 0 }
.stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 12px }
.store { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--h, var(--line)); border-radius: 10px; padding: 11px 13px; display: grid; gap: 5px; cursor: pointer; text-align: left; font: inherit; color: inherit; min-width: 0 }
.store:hover, .store:focus-visible { border-color: #4cc9f077; outline: none }
.store.g { --h: var(--good) } .store.b { --h: var(--bad) } .store.n { --h: var(--cyan) } .store.x { --h: var(--line); opacity: .6; cursor: default }
.store .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700 }
.store .hd small { font-weight: 400; font-size: 11px; color: var(--faint) }
.store .big { font-family: var(--f-data); font-size: 22px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.chip { font-size: 11px; font-family: var(--f-data); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--mute); font-weight: 400; letter-spacing: 0 }
.chip.up { color: var(--good); border-color: #3ddc9744 } .chip.down { color: var(--bad); border-color: #ff6b6b44 }
.store svg { width: 100%; height: 30px; display: block }
.store .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 12px }
.store .sub div { display: flex; justify-content: space-between; gap: 6px; color: var(--mute); min-width: 0 } .store .sub b { color: var(--ink); font-weight: 500; font-family: var(--f-data); white-space: nowrap }
.store .ft { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px }
.flag { border-radius: 4px; padding: 0 6px; background: #ff6b6b1f; color: var(--bad) } .flag.ok { background: #3ddc971a; color: var(--good) } .flag.mid { background: #4cc9f01a; color: var(--cyan) }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.hb { display: grid; gap: 7px }
.hb .r { display: grid; grid-template-columns: 68px minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 12px; cursor: pointer }
.hb .r:hover span:first-child { color: var(--cyan) }
.hb .t { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; display: flex }
.hb .t i { display: block; height: 100% }
.hb .v { text-align: right; font-family: var(--f-data); font-size: 12px }
.hb .v small { display: block; color: var(--faint); font-size: 10px; line-height: 1.2 }
.lg2 { display: flex; gap: 12px; font-size: 11px; color: var(--faint); margin-top: 10px; flex-wrap: wrap } .lg2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px }
.dtop { display: grid; gap: 6px } .dtop .d { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px } .dtop .d b { font-family: var(--f-data); font-weight: 500 } .dtop .n { color: var(--faint); font-family: var(--f-data); font-size: 11px }
.dtop .bar { grid-column: 2 / 4; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: -3px } .dtop .bar i { display: block; height: 100%; background: var(--amber) }
.sig { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 12px } .sig div { display: flex; justify-content: space-between; gap: 8px; cursor: pointer } .sig span:last-child { color: var(--mute); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0 }
.pane h2 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap } .pane h2 span { color: var(--faint); font-weight: 400; font-size: 12px }
.pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px }
.pill { font: inherit; font-size: 12px; color: var(--mute); background: none; border: 1px solid var(--line); border-radius: 12px; padding: 1px 10px; cursor: pointer }
.pill.on { color: #04121c; background: var(--cyan); border-color: var(--cyan); font-weight: 600 }
#chart svg { display: block; width: 100% }
#chart text, .hr text { fill: var(--faint); font-size: 11px; font-family: var(--f-data) }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--mute); margin-top: 4px; flex-wrap: wrap } .legend i { display: inline-block; width: 12px; height: 3px; margin-right: 5px; vertical-align: middle }
.rank { display: grid; gap: 6px }
.rank .r { display: grid; grid-template-columns: 74px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 12px }
.rank .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; position: relative } .rank .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px }
.rank .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint) }
.bad { display: grid; gap: 8px; max-height: 420px; overflow: auto }
.bitem { border: 1px solid var(--line); border-left: 3px solid var(--rose); border-radius: 6px; padding: 8px 10px; background: var(--panel2); font-size: 12.5px }
.bitem .m { color: var(--faint); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap } .bitem .m b { color: var(--ink); font-weight: 500 }
.rep { white-space: pre-wrap; font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 360px; overflow: auto; margin: 0; font-family: var(--f-body) }
.empty { color: var(--faint); font-size: 12px; padding: 8px 0 }
.modal { position: fixed; inset: 0; z-index: 20; background: #02060dcc; backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px }
.sheet { width: min(1040px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--h, var(--cyan)); border-radius: 14px; box-shadow: 0 30px 80px -20px #000 }
.mh { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 12px; padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap }
.mh h2 { margin: 0; font-size: 18px } .mh span { color: var(--faint); font-size: 12px }
.xb { margin-left: auto; font: inherit; font-size: 22px; line-height: 1; background: none; border: 0; color: var(--mute); cursor: pointer }
.mb { padding: 14px 18px 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)) }
.mb .full { grid-column: 1 / -1 }
.blk { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0 }
.blk h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline } .blk h3 span { color: var(--faint); font-weight: 400; font-size: 11px }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px } .kv:last-child { border-bottom: 0 } .kv b { font-family: var(--f-data); font-weight: 500 }
table { width: 100%; border-collapse: collapse; font-size: 12px } td, th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right } th { color: var(--faint); font-weight: 400 } td:first-child, th:first-child { text-align: left } td { font-family: var(--f-data) } td:first-child { font-family: var(--f-body) }
.hrs { display: flex; align-items: flex-end; gap: 4px; height: 96px; padding-top: 14px }
.hrs div { flex: 1; background: #4cc9f055; border-radius: 3px 3px 0 0; position: relative; min-width: 6px }
.hrs div.pk { background: var(--amber) }
.hrs b { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 500; font-family: var(--f-data) }
.hrs span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--faint); font-family: var(--f-data) }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) } .grid2, .trio { grid-template-columns: 1fr } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .status { margin-left: 0 } .kpi b { font-size: 18px } }
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">禧聚 <b>运营</b> 驾驶舱</div>
    <nav class="tabs"><a class="tab" href="#s-stores">门店</a><a class="tab" href="#s-cmp">菜品/同行/新老客</a><a class="tab" href="#s-trend">走势</a><a class="tab" href="#s-bad">差评</a><a class="tab" href="#s-rep">报告</a></nav>
    <div class="status">
      <span id="src"></span>
      <span class="datebar"><button id="prev" aria-label="前一天">‹</button><input id="date" type="date"><button id="next" aria-label="后一天">›</button></span>
      <a href="/cockpit/" id="bossLink" hidden>老板驾驶舱 ↗</a><a href="/cockpit/logout">退出</a>
    </div>
  </header>
  <div class="say"><h1 id="sayH">—</h1><p id="sayP">读取中…</p></div>
  <div class="kpis" id="kpis"></div>
  <div class="sec" id="s-stores">各门店 <span>点卡片看详情 · 绿=比上周同日涨 · 红=跌超 10%</span></div>
  <div class="stores" id="stores"></div>
  <div class="sec" id="s-cmp">菜品 · 同商圈 · 新老客 <span>点任意一行看这家店详情</span></div>
  <div class="trio">
    <div class="pane"><h2>同商圈对比 <span>曝光是同行的几倍</span></h2><div class="hb" id="peer"></div><div class="lg2"><span><i style="background:var(--good)"></i>8 倍以上 强</span><span><i style="background:var(--cyan)"></i>3–8 倍</span><span><i style="background:var(--bad)"></i>3 倍以下 弱</span></div></div>
    <div class="pane"><h2>新客 / 老客 <span id="custSub">按周</span></h2><div class="hb" id="cust"></div><div class="lg2"><span><i style="background:var(--cyan)"></i>新客</span><span><i style="background:var(--amber)"></i>老客</span></div></div>
    <div class="pane"><h2>卖得最好的菜 <span>不含饮料</span></h2><div id="dish"></div></div>
  </div>
  <div class="empty" id="cmpNote"></div>
  <div class="sec" id="s-trend">走势与排名</div>
  <div class="grid2">
    <div class="pane"><h2>营业额每日走势 <span id="chartSub">近 30 天 · 含外卖</span></h2><div class="pills" id="pills"></div><div id="chart"></div>
      <div class="legend"><span><i style="background:#4cc9f0aa"></i>当天营业额</span><span><i style="background:var(--amber)"></i>上周同一天</span><span><i style="background:var(--faint)"></i>周末</span></div></div>
    <div class="pane"><h2>环比排名 <span>比上周同一天</span></h2><div class="rank" id="rank"></div></div>
  </div>
  <div class="sec" id="s-bad">差评与报告</div>
  <div class="grid2">
    <div class="pane"><h2>差评原文 <span id="badSub">点评 + 美团</span></h2><div class="bad" id="bad"></div></div>
    <div class="pane" id="s-rep"><h2>推送的报告 <span>每天 8 点</span></h2><div class="pills" id="rtabs"></div><pre class="rep" id="rep"></pre></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('en-US');
  const wan = n => n == null || !isFinite(n) ? '—' : (Math.abs(n) >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 1 : 2).replace(/\.?0+$/, '') + '万' : fmt(n));
  const ps = x => x == null || !isFinite(x) ? '—' : (x > 0 ? '+' : '') + Math.round(x * 100) + '%';
  const cl = x => x == null || !isFinite(x) ? '' : x > 0.005 ? 'up' : x < -0.005 ? 'down' : '';
  const chip = (lbl, x) => `<span class="chip ${cl(x)}">${lbl} ${ps(x)}</span>`;
  const short = s => String(s).replace(/^(深圳|广州|佛山|珠海|东莞|惠州)/, '').replace(/店$/, '').replace('蛇口招商花园城', '花园城').replace('华强北燕南', '华强北').replace('东城33小镇', '33小镇');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ymd = t => new Date(t + 8 * 3600e3).toISOString().slice(0, 10);
  const add = (d, n) => ymd(Date.parse(d + 'T00:00:00+08:00') + n * 864e5);
  const yday = add(ymd(Date.now()), -1);
  let D = null, cur = yday, pick = '全部门店', repKey = 'daily';
  try { pick = localStorage.getItem('ops-pick') || pick; } catch (e) { }
  $('date').value = cur; $('date').max = yday;
  $('prev').onclick = () => go(add(cur, -1)); $('next').onclick = () => { if (cur < yday) go(add(cur, 1)); }; $('date').onchange = e => go(e.target.value);
  function go(d) { cur = d; $('date').value = d; load(); }
  async function load() {
    try {
      const r = await fetch('/cockpit/api/ops?date=' + cur + '&days=35', { credentials: 'same-origin' });
      if (r.status === 401) { location.href = '/cockpit/login?next=ops'; return; }
      D = await r.json(); if (!D.ok) throw new Error(D.error || '读取失败'); render();
    } catch (e) { $('sayP').textContent = '⚠️ ' + e.message; }
  }
  const spark = (vals, w, h, color, mark) => { const v = vals.filter(x => x != null); if (v.length < 2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`; const mx = Math.max(...v), mn = Math.min(...v) * 0.9; const X = i => i * w / (vals.length - 1), Y = x => h - 2 - (h - 4) * (x - mn) / Math.max(1, mx - mn); let d = ''; vals.forEach((x, i) => { if (x == null) return; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1); }); const li = vals.length - 1; return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}14" stroke="none"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${mark && vals[li] != null ? `<circle cx="${X(li)}" cy="${Y(vals[li])}" r="2.2" fill="${color}"/>` : ''}</svg>`; };
  const series = (key, end, n) => { const T = D.trend || []; const i = T.findIndex(r => r.date === end); const to = i < 0 ? T.length - 1 : i; return T.slice(Math.max(0, to - n + 1), to + 1).map(r => key === '全部门店' ? (Object.entries(r).filter(([k]) => k !== 'date').reduce((t, [, v]) => v == null ? t : (t || 0) + v, null)) : r[key]); };
  function render() {
    const day = D.day, T = day.T, g = D.gj || {};
    $('bossLink').hidden = D.role !== 'boss';
    $('src').innerHTML = `<span><i class="dot ${day.gjOk ? 'on' : 'off'}"></i>管家</span><span><i class="dot ${day.jybOk ? 'on' : 'off'}"></i>经营宝</span>`;
    const rows = day.rows.filter(r => !r.missing);
    const up = rows.filter(r => r.c.total.wow > 0.005).length, down = rows.filter(r => r.c.total.wow < -0.1);
    $('sayH').textContent = `${day.date.slice(5).replace('-', '/')}（${day.week}）`;
    $('sayP').innerHTML = rows.length ? `${rows.length} 家店营业额 <b class="mono">${wan(T.total)}</b>，比上周同一天 <b class="${cl(T.wow)}">${ps(T.wow)}</b>${T.yoy != null ? `，比去年同期 <b class="${cl(T.yoy)}">${ps(T.yoy)}</b>` : ''}；${up} 家在涨${down.length ? `，<b class="down">${down.map(r => short(r.store)).join('、')}</b> 跌超 10%` : ''}${T.badText ? `；差评原文 ${T.badText} 条` : (T.bad ? `；差评 ${T.bad} 条` : '')}。` + (!day.gjOk ? ' <span class="chip">管家这天还没查到，先用门店日报</span>' : '')
      : '这天还没有数据。插件每天早上 6:30 查美团管家、7 点查经营宝；刚装好的话，在插件侧边栏点「现在查一次」。';
    const sp = k => spark(series('全部门店', day.date, 14).map((v, i, a) => k === 'total' ? v : null), 120, 26, '#4cc9f0', true);
    const K = [['营业额', wan(T.total), `环比 <span class="${cl(T.wow)}">${ps(T.wow)}</span> · 同比 <span class="${cl(T.yoy)}">${ps(T.yoy)}</span>`, spark(series('全部门店', day.date, 14), 120, 26, '#4cc9f0', true)],
      ['堂食', wan(T.dine), T.total ? '占 ' + Math.round(T.dine / T.total * 100) + '%' : '', ''], ['外卖', wan(T.takeout), T.total ? '占 ' + Math.round(T.takeout / T.total * 100) + '%' : '', ''],
      ['开台数', fmt(T.tables), T.tables ? '桌均 ' + fmt(T.dine / T.tables) + ' 元' : '', ''], ['用餐人数', fmt(T.guests), T.guests ? '人均 ' + fmt(T.dine / T.guests) + ' 元' : '', ''], ['差评', fmt(Math.max(T.bad || 0, T.badText || 0)), '门店日报 + 经营宝', '']];
    $('kpis').innerHTML = K.map(k => `<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><div class="c">${k[2]}</div>${k[3]}</div>`).join('');
    const all = day.rows.slice().sort((a, b) => (b.total || -1) - (a.total || -1));
    $('stores').innerHTML = all.map((r, i) => {
      if (r.missing) return `<div class="store x"><div class="hd">${short(r.store)}<small>没有数据</small></div></div>`;
      const w = r.c.total.wow; const k = w == null ? 'n' : w > 0.005 ? 'g' : w < -0.1 ? 'b' : 'n';
      const bad = Math.max((r.dpBad || 0) + (r.mtBad || 0) + (r.dyBad || 0) + (r.wmBad || 0), (r.badText || []).length);
      const peer = r.jyb && r.jyb.viewPeer ? r.jyb.view / r.jyb.viewPeer : null;
      const flags = []; if (bad) flags.push(`<span class="flag">差评 ${bad}</span>`); if (peer != null) flags.push(`<span class="flag ${peer >= 8 ? 'ok' : peer >= 3 ? 'mid' : ''}">曝光是同行 ${peer.toFixed(1)} 倍</span>`); if (r.peak) flags.push(`<span class="flag mid">高峰 ${r.peak.hh}</span>`); if (r.src === '日报') flags.push('<span class="flag mid">门店日报数</span>');
      return `<button class="store ${k}" data-s="${esc(r.store)}"><div class="hd">${short(r.store)}<small>第 ${i + 1}</small></div>

        ${spark(series(short(r.store), day.date, 14), 240, 30, k === 'b' ? '#ff6b6b' : k === 'g' ? '#3ddc97' : '#4cc9f0', true)}
        <div class="sub"><div>堂食<b>${wan(r.dine)}</b></div><div>外卖<b>${wan(r.takeout)}</b></div><div>开台<b>${fmt(r.tables)} <span class="${cl(r.c.tables.wow)}">${r.c.tables.wow != null ? ps(r.c.tables.wow) : ''}</span></b></div><div>人数<b>${fmt(r.guests)}</b></div><div>桌均<b>${fmt(r.tableAvg)}</b></div><div>人均<b>${fmt(r.perCap)} <span class="${cl(r.c.perCap.wow)}">${r.c.perCap.wow != null ? ps(r.c.perCap.wow) : ''}</span></b></div></div>
        ${flags.length ? `<div class="ft">${flags.join('')}</div>` : ''}</button>`;
    }).join('');
    $('stores').querySelectorAll('.store[data-s]').forEach(b => b.onclick = () => open(b.dataset.s));
    // 排名：环比
    const rk = rows.filter(r => r.c.total.wow != null).sort((a, b) => b.c.total.wow - a.c.total.wow); const mx = Math.max(0.1, ...rk.map(r => Math.abs(r.c.total.wow)));
    $('rank').innerHTML = rk.length ? rk.map(r => { const v = r.c.total.wow, wv = Math.abs(v) / mx * 50; return `<div class="r"><span>${short(r.store)}</span><div class="bar"><span class="mid"></span><i style="${v >= 0 ? 'left:50%' : 'right:50%'};width:${wv}%;background:${v >= 0 ? 'var(--good)' : 'var(--bad)'}"></i></div><span class="mono ${cl(v)}" style="text-align:right">${ps(v)}</span></div>`; }).join('') : '<div class="empty">上周同一天的数据还在补，明后天就有</div>';
    // 差评
    const bl = rows.flatMap(r => (r.badText || []).map(b => Object.assign({ s: r.store }, b)));
    $('badSub').textContent = day.jybOk ? `点评 + 美团 · ${bl.length} 条` : '经营宝这天还没查到';
    $('bad').innerHTML = bl.length ? bl.map(b => `<div class="bitem"><div class="m"><b>${short(b.s)}</b><span>${esc(b.p)} ${b.star != null ? esc(b.star) + ' 星' : ''}</span><span>${esc(b.t || '')}</span>${b.replied === false ? '<span class="down">未回复</span>' : ''}</div>${esc(b.text)}</div>`).join('') : `<div class="empty">${day.jybOk ? '这天点评、美团没有新差评' : '经营宝数据到了以后，差评原文会显示在这里'}</div>`;
    // 菜品 · 同商圈 · 新老客：三块小图，少数字
    const live = all.filter(r => !r.missing);
    const pr = live.filter(r => r.jyb && r.jyb.viewPeer).map(r => ({ r, x: r.jyb.view / r.jyb.viewPeer, b: r.jyb.buyPeer ? r.jyb.buy / r.jyb.buyPeer : null })).sort((a, b) => b.x - a.x); const pm = Math.max(10, ...pr.map(z => z.x));
    $('peer').innerHTML = pr.length ? pr.map(z => `<div class="r" data-o="${esc(z.r.store)}"><span>${short(z.r.store)}</span><div class="t"><i style="width:${Math.min(100, z.x / pm * 100)}%;background:${z.x >= 8 ? 'var(--good)' : z.x >= 3 ? 'var(--cyan)' : 'var(--bad)'}"></i></div><span class="v">${z.x.toFixed(1)}倍${z.b != null ? `<small>购买 ${z.b.toFixed(1)}倍</small>` : ''}</span></div>`).join('') : '<div class="empty">经营宝这天的数据还没查到</div>';
    const cu = live.filter(r => r.cust && r.cust.newBuy != null).map(r => ({ r, n: r.cust.newBuy || 0, o: r.cust.oldBuy || 0 })).sort((a, b) => (b.o / Math.max(1, b.n + b.o)) - (a.o / Math.max(1, a.n + a.o))); const cm = Math.max(1, ...cu.map(z => z.n + z.o));
    const cw0 = cu[0] && cu[0].r.cust; $('custSub').textContent = cw0 ? `${String(cw0.from).slice(4, 6)}/${String(cw0.from).slice(6)} 那周 · 按老客占比排` : '按周';
    $('cust').innerHTML = cu.length ? cu.map(z => `<div class="r" data-o="${esc(z.r.store)}"><span>${short(z.r.store)}</span><div class="t" style="width:${Math.max(18, (z.n + z.o) / cm * 100)}%"><i style="width:${z.n / Math.max(1, z.n + z.o) * 100}%;background:var(--cyan)"></i><i style="width:${z.o / Math.max(1, z.n + z.o) * 100}%;background:var(--amber)"></i></div><span class="v">老客 ${Math.round(z.o / Math.max(1, z.n + z.o) * 100)}%<small>${fmt(z.n + z.o)} 人</small></span></div>`).join('') : '<div class="empty">还没查到（美团只按周给）</div>';
    const agg = {}; live.forEach(r => (r.top || []).forEach(d => { const k = d.name.replace(/[（(].*?[)）]/g, '').replace(/[.。\s]+$/, ''); agg[k] = (agg[k] || 0) + (d.qty || 0); }));
    const at = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 5); const am = Math.max(1, ...at.map(z => z[1]));
    $('dish').innerHTML = at.length ? `<div class="status" style="margin:0 0 6px;font-size:11px;color:var(--faint)">全品牌合计</div><div class="dtop">${at.map((z, i) => `<div class="d"><span class="n">${i + 1}</span><span>${esc(z[0].slice(0, 12))}</span><b>${fmt(z[1])}</b><div class="bar"><i style="width:${z[1] / am * 100}%"></i></div></div>`).join('')}</div>
      <div class="sig"><div style="cursor:default;color:var(--faint);font-size:11px"><span>各店卖得最好的</span><span></span></div>${live.filter(r => (r.top || []).length).map(r => `<div data-o="${esc(r.store)}"><span>${short(r.store)}</span><span>${esc(r.top[0].name.replace(/[（(].*?[)）]/g, '').slice(0, 10))} · ${fmt(r.top[0].qty)}</span></div>`).join('')}</div>` : '<div class="empty">管家这天的菜品数据还没查到</div>';
    document.querySelectorAll('#peer [data-o], #cust [data-o], #dish [data-o]').forEach(a => a.onclick = () => open(a.dataset.o));
    const cw = rows.find(r => r.cust); const notes = [];
    if (!rows.some(r => (r.top || []).length)) notes.push('菜品销量：美团管家这天的菜品数据还没查到（插件查管家时会一起查）。');
    if (!day.jybOk) notes.push('同商圈对比：美团经营宝这天的数据还没查到。插件早上 7 点后查，查到前这几列是「—」；如果一直没有，看插件侧边栏有没有报错（可能经营宝没登录）。');
    if (!cw) notes.push('新客/老客：美团只按周给，插件每周查一次上周的数，还没查到。'); else notes.push('新客/老客只算在美团、点评买团购或买单的顾客；同商圈 = 经营宝「商圈同行店均」。点任意一行看这家店的详细数字。');
    $('cmpNote').textContent = notes.join(' ');
    chart(); reports();
  }
  function chart() {
    const T = D.trend || []; const keys = ['全部门店'].concat(Object.keys(T[0] || {}).filter(k => k !== 'date'));
    if (!keys.includes(pick)) pick = '全部门店';
    $('pills').innerHTML = keys.map(k => `<button class="pill ${k === pick ? 'on' : ''}" data-k="${esc(k)}">${esc(k)}</button>`).join('');
    $('pills').querySelectorAll('.pill').forEach(b => b.onclick = () => { pick = b.dataset.k; try { localStorage.setItem('ops-pick', pick); } catch (e) { } chart(); });
    const all = series(pick, T.length ? T[T.length - 1].date : '', T.length); const show = T.slice(-30), vals = all.slice(-30), prev = all.slice(-37, -7);
    while (prev.length < vals.length) prev.unshift(null);
    const has = vals.filter(v => v != null); if (!has.length) { $('chart').innerHTML = '<div class="empty">还没有数据。插件第一次跑完以后，每 5 分钟补 6 天，大约一小时补齐近 30 天。</div>'; return; }
    const W = Math.max(300, $('chart').clientWidth || 640), H = 230, L = 44, R = 6, Tp = 10, B = 22; const n = show.length;
    const mx = Math.max(...has, ...prev.filter(v => v != null)) * 1.1; const bw = (W - L - R) / n;
    const X = i => L + i * bw, Y = v => Tp + (H - Tp - B) * (1 - v / mx);
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(pick)}营业额走势">`;
    for (let k = 0; k <= 3; k++) { const v = mx * k / 3; s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1e2c45"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v >= 1e4 ? (v / 1e4).toFixed(v >= 1e5 ? 0 : 1) + '万' : Math.round(v)}</text>`; }
    show.forEach((r, i) => { const wd = new Date(r.date + 'T00:00:00Z').getUTCDay(); const v = vals[i]; const sel = r.date === D.day.date; if (wd === 0 || wd === 6) s += `<rect x="${X(i)}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="#ffffff06"/>`; if (v != null) s += `<rect x="${X(i) + bw * 0.18}" y="${Y(v)}" width="${bw * 0.64}" height="${H - B - Y(v)}" rx="2" fill="${sel ? '#4cc9f0' : '#4cc9f066'}"><title>${r.date} ${wan(v)}${prev[i] != null ? '（上周同日 ' + wan(prev[i]) + '）' : ''}</title></rect>`; const st8 = Math.ceil(n / 8), si = show.findIndex(z => z.date === D.day.date); if ((i % st8 === 0 && (si < 0 || Math.abs(i - si) >= st8 / 2)) || sel) s += `<text x="${X(i) + bw / 2}" y="${H - 6}" text-anchor="middle" ${sel ? 'style="fill:#e6edf7"' : ''}>${r.date.slice(5).replace('-', '/')}</text>`; });
    let d = ''; prev.forEach((v, i) => { if (v == null) return; d += (d && prev[i - 1] != null ? 'L' : 'M') + (X(i) + bw / 2).toFixed(1) + ' ' + Y(v).toFixed(1); }); if (d) s += `<path d="${d}" fill="none" stroke="#ffb547" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    $('chart').innerHTML = s + '</svg>';
    const sum = a => a.filter(v => v != null).reduce((t, v) => t + v, 0); const a7 = sum(vals.slice(-7)), p7 = sum(prev.slice(-7));
    $('chartSub').textContent = `近 30 天 · 含外卖${a7 && p7 ? ' · 近 7 天比前 7 天 ' + ps((a7 - p7) / p7) : ''}`;
  }
  function open(s) {
    const r = D.day.rows.find(x => x.store === s); if (!r) return; const w = r.c.total.wow; const hue = w == null ? 'var(--cyan)' : w > 0.005 ? 'var(--good)' : w < -0.1 ? 'var(--bad)' : 'var(--cyan)';
    const hrs = (r.hours || []).filter(h => h.tables); const mx = Math.max(1, ...hrs.map(h => h.tables)); const pk = r.peak ? r.peak.hh : '';
    const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`; const pc = (k, o) => `${o.wow != null ? `<span class="${cl(o.wow)}">${ps(o.wow)}</span>` : '—'} / ${o.yoy != null ? `<span class="${cl(o.yoy)}">${ps(o.yoy)}</span>` : '—'}`;
    const x = r.jyb;
    $('sheet').style.setProperty('--h', hue);
    $('sheet').innerHTML = `<div class="mh"><h2>${short(r.store)}</h2><span>${D.day.date}（${D.day.week}）· 环比 / 同比</span><button class="xb" id="mx" aria-label="关闭">×</button></div><div class="mb">
      <div class="blk"><h3>营业 <span>${r.src === '管家' ? '美团管家' : '门店日报'}</span></h3>${kv('营业额', wan(r.total) + '　' + pc('', r.c.total))}${kv('堂食', wan(r.dine) + '　' + pc('', r.c.dine))}${kv('外卖', wan(r.takeout) + '　' + pc('', r.c.takeout))}${kv('开台数', fmt(r.tables) + '　' + pc('', r.c.tables))}${kv('用餐人数', fmt(r.guests) + '　' + pc('', r.c.guests))}${kv('桌均 / 人均', fmt(r.tableAvg) + ' / ' + fmt(r.perCap))}${kv('翻台率 / 用餐时长', (r.flip ? (+r.flip).toFixed(2) : '—') + ' / ' + (r.mealMin ? r.mealMin + ' 分钟' : '—'))}${kv('优惠金额', wan(r.discount))}</div>
      <div class="blk"><h3>每小时开台 <span>结账时间${pk ? ' · 高峰 ' + pk : ''}</span></h3>${hrs.length ? `<div class="hrs">${hrs.map(h => `<div class="${h.hh === pk ? 'pk' : ''}" style="height:${Math.max(5, h.tables / mx * 100)}%"><b>${h.tables}</b><span>${h.hh.slice(0, 2)}</span></div>`).join('')}</div><div style="height:20px"></div>` : '<div class="empty">没有时段数据</div>'}
        <h3 style="margin-top:10px">销量前五 <span>不含饮料</span></h3>${(r.top || []).map((d, i) => kv(`${i + 1}. ${esc(d.name)}`, fmt(d.qty) + ' 份')).join('') || '<div class="empty">管家菜品数据没查到</div>'}</div>
      <div class="blk"><h3>口碑 <span>门店日报</span></h3>${[['大众点评', r.dp, r.dpBad], ['美团', r.mt, r.mtBad], ['抖音', r.dy, r.dyBad], ['美团外卖', r.wm, r.wmBad]].map(z => kv(z[0], (z[1] == null ? '—' : z[1]) + ' 分 · 差评 ' + (z[2] || 0))).join('')}
        ${r.cust && r.cust.newBuy != null ? `<h3 style="margin-top:10px">新客 / 老客 <span>${esc(String(r.cust.from || '').slice(4, 6))}/${esc(String(r.cust.from || '').slice(6))} 那周 · 团购和买单</span></h3>${kv('新客 / 老客', fmt(r.cust.newBuy) + ' / ' + fmt(r.cust.oldBuy))}${kv('老客占比', (r.cust.newBuy + r.cust.oldBuy) ? Math.round(r.cust.oldBuy / (r.cust.newBuy + r.cust.oldBuy) * 100) + '%' : '—')}${kv('复购率', r.cust.repurchase != null ? (r.cust.repurchase * 100).toFixed(1) + '%' + (r.cust.repurchasePeer ? '（比同行 ' + esc(r.cust.repurchasePeer) + '）' : '') : '—')}` : ''}</div>
      ${x ? `<div class="blk full"><h3>和商圈同行比 <span>美团经营宝「商圈同行店均」</span></h3><div style="overflow-x:auto"><table><thead><tr><th>指标</th><th>本店</th><th>同行店均</th><th>是同行的</th></tr></thead><tbody>${[['曝光人数', x.view, x.viewPeer], ['访问人数', x.visit, x.visitPeer], ['团购购买人数', x.buy, x.buyPeer], ['新增收藏', x.collect, x.collectPeer], ['打卡人数', x.checkin, x.checkinPeer], ['新增评价', x.review, x.reviewPeer]].filter(z => z[1] != null).map(z => `<tr><td>${z[0]}</td><td>${fmt(z[1])}</td><td>${z[2] != null ? (+z[2]).toFixed(z[2] < 100 ? 1 : 0) : '—'}</td><td class="${z[2] && z[1] / z[2] < 1 ? 'down' : ''}">${z[2] ? (z[1] / z[2]).toFixed(1) + ' 倍' : '—'}</td></tr>`).join('')}${x.cvr != null ? `<tr><td>访问→购买转化率</td><td>${(x.cvr * 100).toFixed(1)}%</td><td>${x.cvrPeer != null ? (x.cvrPeer * 100).toFixed(1) + '%' : '—'}</td><td class="${x.cvrPeer && x.cvr < x.cvrPeer ? 'down' : ''}">${x.cvrPeer ? (x.cvr / x.cvrPeer).toFixed(1) + ' 倍' : ''}</td></tr>` : ''}</tbody></table></div></div>` : ''}
      ${(r.badText || []).length ? `<div class="blk full"><h3>差评原文 <span>${r.badText.length} 条</span></h3><div class="bad">${r.badText.map(b => `<div class="bitem"><div class="m"><span>${esc(b.p)} ${b.star != null ? esc(b.star) + ' 星' : ''}</span><span>${esc(b.t || '')}</span>${b.replied === false ? '<span class="down">未回复</span>' : ''}</div>${esc(b.text)}</div>`).join('')}</div></div>` : ''}
    </div>`;
    $('modal').hidden = false; $('mx').onclick = close; $('mx').focus();
  }
  function close() { $('modal').hidden = true; }
  $('modal').onclick = e => { if (e.target === $('modal')) close(); }; document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  function reports() {
    const L = D.last || {}; const keys = [['daily', '日报'], ['week', '周报'], ['month', '月报']].filter(k => L[k[0]]);
    if (!keys.length) { $('rtabs').innerHTML = ''; $('rep').textContent = '还没有推送过。每天 8 点推送后这里显示最近一份；想先看，在经营日报群发「运营日报」。'; return; }
    if (!L[repKey]) repKey = keys[0][0];
    $('rtabs').innerHTML = keys.map(k => `<button class="pill ${k[0] === repKey ? 'on' : ''}" data-k="${k[0]}">${k[1]}</button>`).join('');
    $('rtabs').querySelectorAll('.pill').forEach(b => b.onclick = () => { repKey = b.dataset.k; reports(); });
    $('rep').textContent = (L[repKey].text || '') + (L[repKey].at ? '\n\n（推送时间 ' + new Date(L[repKey].at).toLocaleString('zh-CN', { hour12: false }) + '）' : '');
  }
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => D && chart(), 150); });
  load();
})();
</script>

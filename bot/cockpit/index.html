  top7: [{ plat: '小红书', acc: 'Liu in', title: '11-12月去佛山旅游｜这些地方很适合', views: 24000, times: 9.4, engRate: 3.6, date: '10/28' }, { plat: '抖音矩阵号', acc: '还能吃一些香菜', title: '老广爱的镬气小炒', views: 7861, times: 2.6, engRate: 0.5, date: '10/30' }, { plat: '小红书', acc: '欧阳', title: '去深圳必吃的大排档', views: 3000, times: 6, engRate: 6, date: '11/02' }]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n == null ? '—' : Math.round(n).toLocaleString('en-US');
const pct = x => x == null ? '—' : (x > 0 ? '+' : '') + (Math.round(x * 1000) / 10) + '%';
let S = SAMPLE;

function render() {
  $('#sample').hidden = !S.sample;
  const open = S.todos.filter(t => t.status === '待定');
  $('#nTodo').textContent = open.length; $('#waitBtn').textContent = `等你 ${open.length} 件`;
  $('#bossName').textContent = S.boss; $('#linkTxt').textContent = `汇报 每天 ${S.briefTime}`;
  $('#ceoMeta').textContent = `每 10 分钟巡视 · 今天巡视 ${S.ceo.patrols} 轮 · 汇报 ${S.ceo.reports} 次`;
  $('#ceoSay').textContent = S.ceo.say;
  $('#online').textContent = `${S.agents.filter(a => a.status !== 'off').length}/${S.agents.length} Agent 在岗`;
  const stTxt = { ok: ['ok', '运行中'], wait: ['wait', '等你'], off: ['off', '未接入'] };
  const icon = { biz: '¥', content: '✎', ads: '↗', rep: '★' };
  $('#tags').innerHTML = S.agents.map(a => `<div class="tag hue-${a.hue || 'cyan'}">↓ ${esc(a.down || '')}<br><b>↑ ${esc(a.up || '')}</b></div>`).join('');
  $('#agents').innerHTML = S.agents.map(a => `<div class="col hue-${a.hue || 'cyan'}"><button class="agent" data-open="${a.key}" id="ag-${a.key}"><div class="hd"><span><span class="ic">${icon[a.key] || '•'}</span>${esc(a.name)}</span><span class="st ${stTxt[a.status][0]}">${stTxt[a.status][1]}</span></div><div class="big">${esc(a.big)}<small>${esc(a.unit)}</small></div><div class="meta">上次 ${esc(a.last)} → 下次 ${esc(a.next)}</div><div class="sub">${a.sub.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></button>${(a.kids || []).length ? `<div class="kids">${a.kids.map(k => `<div class="kid"><i class="${k.tone || 'ok'}"></i><span style="min-width:0"><b>${esc(k.name)}</b><small>${esc(k.note)}</small></span><span class="v">${esc(k.val)}</span></div>`).join('')}</div>` : ''}</div>`).join('');
  requestAnimationFrame(wires);
  if (!$('#modal').hidden) openAgent(cur);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const id = b.parentElement.dataset.id, t = S.todos.find(x => x.id === id); if (!t) return;
    t.status = b.dataset.act; render();
    if (!S.sample) { try { await fetch('api/todo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, status: t.status }) }); } catch (err) { t.status = '待定'; render(); } }
    return;
  }
  const o = e.target.closest('[data-open]'); if (o) { openAgent(o.dataset.open); return; }
  if (e.target.closest('#waitBtn')) { openAgent('todo'); return; }
  if (e.target.closest('#mClose') || e.target.id === 'modal') closeModal();
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
let cur = null, lastFocus = null;
function closeModal() { $('#modal').hidden = true; cur = null; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
const todoHtml = list => list.length ? `<div class="todo">${list.map(t => `<div class="item" data-type="${esc(t.type)}"><div class="row"><span class="chip">${esc(t.type)}</span></div><div class="t">${esc(t.title)}</div><div class="d">${esc(t.detail)}</div><div class="row" data-id="${esc(t.id)}">${t.status === '待定' ? `<button class="btn yes" data-act="已同意">${t.type === '投放建议' ? '同意投放' : '知道了，去处理'}</button><button class="btn" data-act="不做">${t.type === '投放建议' ? '不投' : '不用管'}</button>` : `<span class="done">✓ ${esc(t.status)}</span>`}</div></div>`).join('')}</div>` : '<div class="empty">没有需要你处理的事。</div>';
const adHtml = (h, why) => `<div class="ad"><div class="k"><b>${esc(h.plat)}·${esc(h.acc)}「${esc((h.title || '').slice(0, 22))}」</b><span class="mono">${fmt(h.views)}</span></div><div class="why">${h.date ? esc(h.date) + ' 发布 · ' : ''}${h.times != null ? '账号常态 ' + h.times + ' 倍 · ' : ''}互动率 ${h.engRate}%${why ? ' · ' + esc(why) : ''}${h.boosted ? ' · 已投流' : ''}</div></div>`;
function openAgent(k) {
  if (!$('#modal').hidden && cur === k) { /* 刷新 */ } else lastFocus = document.activeElement;
  cur = k; const A = S.agents.find(a => a.key === k) || {}; const sheet = $('#sheet');
  sheet.className = 'sheet hue-' + (A.hue || 'amber');
  const R = S.rules || { scoreMin: 4.5, engXhs: 5, engDy: 3, minXhs: 1000, minDy: 3000, hotTimes: 2 };
  const T = type => S.todos.filter(t => t.type === type || (type === '经营' && t.type === '营业异常'));
  let title = '', sub = '', body = '';
  if (k === 'biz') {
    title = '经营 Agent'; sub = `${S.date}（周${S.weekday}）`;
    const max = Math.max(...S.stores.map(r => r.revenue || 0), 1);
    body = `<div class="blk"><h3>今天你要做的事 <span>${T('营业异常').filter(t => t.status === '待定').length} 件待定</span></h3>${todoHtml(T('营业异常'))}</div>
      <div class="blk"><h3>昨天经营 <span>${esc(S.date)}</span></h3><div class="tbl"><table><thead><tr><th>门店</th><th>营业额</th><th>比上周同日</th><th>差评</th></tr></thead><tbody>${S.stores.map(r => `<tr><td>${esc(r.store)}<div class="bar"><i style="width:${(r.revenue || 0) / max * 100}%"></i></div></td><td class="mono">${fmt(r.revenue)}</td><td class="mono ${r.wow > 0 ? 'up' : r.wow < 0 ? 'down' : ''}">${pct(r.wow)}</td><td class="mono ${r.bad ? 'down' : ''}">${r.bad || ''}</td></tr>`).join('')}${S.missing.length ? `<tr><td colspan="4" style="color:var(--amber)">未收到日报：${esc(S.missing.join('、'))}</td></tr>` : ''}</tbody></table></div></div>
      <div class="blk full"><h3>CEO Agent 的结论 <span>${S.briefAt ? new Date(S.briefAt + 8 * 3600e3).toISOString().slice(5, 16).replace('T', ' ') + ' 生成' : ''}</span></h3><div class="brief" style="max-height:none">${esc(S.brief || '今天的简报还没生成。在飞书「经营日报」群发「简报」可以马上生成。')}</div></div>`;
  } else if (k === 'content') {
    title = '内容 Agent'; sub = '最近 7 天的内容表现';
    const C = S.content || {};
    body = `<div class="full kpis">${Object.entries(C).map(([p, v]) => `<div class="kpi"><small>${esc(p)} · 昨天 / 近 7 天</small><b>${v.yesterday} / ${v.last7}</b></div>`).join('') || '<div class="empty">还没有内容数据</div>'}</div>
      <div class="blk"><h3>今天数据好的 <span>近 14 天起量（账号常态 ${R.hotTimes} 倍以上）</span></h3>${(S.hot || []).length ? S.hot.map(h => adHtml(h, S.suggest.some(x => x.title === h.title && x.acc === h.acc) ? '✅ 值得投放' : h.why)).join('') : '<div class="empty">近 14 天没有起量的内容。</div>'}</div>
      <div class="blk"><h3>近 7 天表现最好 <span>按播放 / 小眼睛</span></h3>${(S.top7 || []).length ? S.top7.map(h => adHtml(h)).join('') : '<div class="empty">近 7 天的作品还没有播放数据。</div>'}</div>`;
  } else if (k === 'ads') {
    title = '投放 Agent'; sub = `标准：起量（常态 ${R.hotTimes} 倍、小红书 ≥${R.minXhs} / 抖音 ≥${R.minDy}）＋ 互动率（小红书 ≥${R.engXhs}% / 抖音 ≥${R.engDy}%）＋ 还没投流`;
    body = `<div class="blk"><h3>✅ 符合标准，适合推 <span>${S.suggest.length} 条</span></h3>${S.suggest.length ? S.suggest.map(h => adHtml(h)).join('') : '<div class="empty">今天没有完全达标的内容。</div>'}${T('投放建议').length ? '<div class="sec">待你拍板</div>' + todoHtml(T('投放建议')) : ''}</div>
      <div class="blk"><h3>差一点 <span>数据好但没达标的原因</span></h3>${S.near.length ? S.near.map(h => adHtml(h, h.why)).join('') : '<div class="empty">无</div>'}</div>
      <div class="blk full"><h3>投放渠道</h3>${S.tgt ? `<div class="ad"><div class="k"><b>推广通（大众点评）近 7 天</b><span class="mono">${fmt(S.tgt.spend7)} 元 · ${S.tgt.orders7} 单 · 单笔 ${S.tgt.cpo ?? '—'} 元</span></div><div class="why">环比再前 7 天：花费 ${esc(S.tgt.dSpend || '—')}，订单 ${esc(S.tgt.dOrders || '—')}，单笔成本 ${esc(S.tgt.dCpo || '—')}（${S.tgt.cpoPrev ?? '—'} → ${S.tgt.cpo ?? '—'}），点击率 ${S.tgt.ctr ?? '—'}%（${esc(S.tgt.dCtr || '—')}）· 数据到 ${esc(S.tgt.last)}${S.tgt.stale > 0 ? `（已经 ${S.tgt.stale} 天没更新）` : ''}</div></div>${(S.tgt.stores || []).filter(o => o.verdict && o.verdict !== '维持').map(o => `<div class="ad"><div class="k"><b>${esc(o.verdict === '可加投' ? '✅ 可加投' : o.verdict === '要调整' ? '🔧 要调整' : '⚠️ 检查')} · ${esc(o.store)}</b><span class="mono">${o.cpo ?? '—'} 元/单</span></div><div class="why">${esc(o.why)}<br>👉 ${esc(o.todo)}</div></div>`).join('')}<div class="tbl"><table><thead><tr><th>门店</th><th>结论</th><th>花费</th><th>环比</th><th>订单</th><th>环比</th><th>单笔成本</th><th>环比</th><th>点击率</th><th>转化</th></tr></thead><tbody>${(S.tgt.stores || []).map(o => `<tr><td>${esc(o.store)}</td><td>${esc(o.verdict || '')}</td><td class="mono">${fmt(o.spend7)}</td><td class="mono">${esc(o.dSpend || '')}</td><td class="mono">${o.orders7}</td><td class="mono">${esc(o.dOrders || '')}</td><td class="mono">${o.cpo ?? '—'}</td><td class="mono">${esc(o.dCpo || '')}</td><td class="mono">${o.ctr ?? '—'}%</td><td class="mono">${o.cvr ?? '—'}%</td></tr>`).join('')}</tbody></table></div><div class="why" style="margin-top:6px;font-size:12px;color:var(--mute,#8b95a7)">判断标准：${esc(S.tgt.rule || '')}（全店单笔成本中位 ${S.tgt.medCpo ?? '—'} 元）</div>` : '<div class="ad"><div class="k"><b>推广通（大众点评）</b><span>等报表接入</span></div><div class="why">Debbie 每天把门店报表发到群里后，自动算每家店的花费、团购订单和单笔成本。</div></div>'}<div class="ad"><div class="k"><b>聚光（小红书）</b><span>接口待申请</span></div></div><div class="ad"><div class="k"><b>本地推（抖音）</b><span>接口待申请</span></div></div><div class="ad"><div class="k"><b>抖加</b><span>人工投</span></div><div class="why">没有开放接口，按上面的建议人工投放。</div></div></div>`;
  } else if (k === 'rep') {
    title = '口碑 Agent'; const MB = R.minBy || { dp: null, mt: 4.5, wm: 4.5, dy: 4.5 }; sub = `点评：只看掉分 · 美团/外卖/抖音：低于 4.5 · 任一平台比前一天降 0.1 标红`;
    const sc = (v, prev, min) => v == null ? '<span class="mono" style="color:var(--faint)">—</span>' : `<span class="mono ${(min != null && v < min) || (prev != null && prev - v >= 0.1 - 1e-9) ? 'low' : 'ok-t'}">${v}${prev != null && prev !== v ? `<small style="color:var(--faint)"> ←${prev}</small>` : ''}</span>`;
    const rows = S.stores.slice().sort((a, b) => ((b.bad || 0) - (a.bad || 0)) || ((a.dp ?? 9) - (b.dp ?? 9)));
    const abn = rows.filter(r => [['mt', r.mt], ['wm', r.wm], ['dy', r.dy]].some(([k, v]) => v != null && MB[k] != null && v < MB[k]) || r.bad || (r.dpPrev != null && r.dp != null && r.dpPrev - r.dp >= 0.1 - 1e-9) || (r.mtPrev != null && r.mt != null && r.mtPrev - r.mt >= 0.1 - 1e-9));
    body = `<div class="blk"><h3>⚠️ 有异常的门店 <span>${abn.length} 家</span></h3>${abn.length ? abn.map(r => { const L = []; [['点评', r.dp, r.dpBad, MB.dp], ['美团', r.mt, r.mtBad, MB.mt], ['外卖', r.wm, r.wmBad, MB.wm], ['抖音', r.dy, r.dyBad, MB.dy]].forEach(([n, v, b, min]) => { if (v != null && min != null && v < min) L.push(`${n} ${v} 低于 ${min}`); if (b) L.push(`${n}差评 ${b} 条`); }); if (r.dpPrev != null && r.dp != null && r.dpPrev - r.dp >= 0.1 - 1e-9) L.push(`点评 ${r.dpPrev}→${r.dp}`); if (r.mtPrev != null && r.mt != null && r.mtPrev - r.mt >= 0.1 - 1e-9) L.push(`美团 ${r.mtPrev}→${r.mt}`); if (!L.length && r.bad) L.push(`差评 ${r.bad} 条`); return `<div class="ad"><div class="k"><b>${esc(r.store)}</b></div><div class="why" style="color:var(--bad)">${esc(L.join('；'))}</div></div>`; }).join('') : '<div class="empty">各平台都正常。</div>'}${T('口碑').length ? '<div class="sec">待处理</div>' + todoHtml(T('口碑')) : ''}</div>
      <div class="blk"><h3>各店评分 <span>${esc(S.date)}</span></h3><div class="tbl"><table><thead><tr><th>门店</th><th>点评</th><th>美团</th><th>外卖</th><th>抖音</th><th>差评</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.store)}</td><td>${sc(r.dp, r.dpPrev, MB.dp)}</td><td>${sc(r.mt, r.mtPrev, MB.mt)}</td><td>${sc(r.wm, null, MB.wm)}</td><td>${sc(r.dy, null, MB.dy)}</td><td class="mono ${r.bad ? 'down' : ''}">${r.bad || ''}</td></tr>`).join('')}</tbody></table></div><div class="sec">外卖、抖音评分等华付数科日报加上后自动显示</div></div>`;
  } else {
    title = '等你拍板'; sub = `${S.todos.filter(t => t.status === '待定').length} 件待定`;
    body = `<div class="blk full">${todoHtml(S.todos)}</div>`;
  }
  $('#mTitle').textContent = title; $('#mSub').textContent = sub; $('#mBody').innerHTML = body;
  if ($('#modal').hidden) { $('#modal').hidden = false; document.body.style.overflow = 'hidden'; $('#mClose').focus(); }
}
function wires() {
  const svg = $('#wires'), tree = $('#tree'), ceo = document.querySelector('.ceo'); if (!svg || !ceo || getComputedStyle(svg).display === 'none') return;
  const T = tree.getBoundingClientRect(), C = ceo.getBoundingClientRect();
  const x0 = C.left + C.width / 2 - T.left, y0 = C.bottom - T.top;
  const cols = { amber: '#ff9f43', cyan: '#4cc9f0', green: '#3ddc97', rose: '#ff6b9a' };
  svg.innerHTML = [...document.querySelectorAll('#agents .agent')].map((el, i) => { const r = el.getBoundingClientRect(); const x1 = r.left + r.width / 2 - T.left, y1 = r.top - T.top; const d = `M${x0},${y0} C${x0},${y0 + 40} ${x1},${y1 - 50} ${x1},${y1}`; const c = cols[(S.agents[i] || {}).hue] || '#4cc9f0'; return `<path class="base" d="${d}"/><path class="flow" d="${d}" stroke="${c}" style="animation-delay:${-i * .4}s"/>`; }).join('');
}
addEventListener('resize', () => requestAnimationFrame(wires));
function tick() { const d = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 6e4); $('#clock').textContent = d.toTimeString().slice(0, 8); }
setInterval(tick, 1000); tick();

(async () => {
  render();
  if (location.protocol.startsWith('http') && !/claude|claudeusercontent/.test(location.host)) {
    try { const r = await fetch('api/state', { cache: 'no-store' }); if (r.ok) { S = await r.json(); render(); } } catch (e) { }
  }
})();
</script>
